<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ business.nombre }}{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

      <a href="/reservar" class="nav-cta">Reservar turno</a>
